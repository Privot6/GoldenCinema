server {
    listen 80;
    server_name goldencinema.jonarski.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name goldencinema.jonarski.pl;

    ssl_certificate /etc/letsencrypt/live/goldencinema.jonarski.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldencinema.jonarski.pl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    location /download/ {
        alias /usr/share/nginx/html/download/;
        index index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://admin-panel:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
