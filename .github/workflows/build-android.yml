name: Build and Deploy Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        working-directory: frontend
        run: chmod +x gradlew

      - name: Set BASE_URL
        working-directory: frontend
        run: echo "BASE_URL=https://goldencinema.bieda.it/api/" >> local.properties

      - name: Build debug APK
        working-directory: frontend
        run: ./gradlew assembleDebug

      - name: Upload APK to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MIKRUS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -i ~/.ssh/deploy_key \
            -P ${{ secrets.MIKRUS_PORT }} \
            -o StrictHostKeyChecking=no \
            frontend/app/build/outputs/apk/debug/app-debug.apk \
            ${{ secrets.MIKRUS_USER }}@${{ secrets.MIKRUS_HOST }}:/root/GoldenCinema/docker/nginx/download/app.apk
