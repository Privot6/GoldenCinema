spring.profiles.active=dev
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.web.error.include-message=always
# Read Stripe keys from environment variables to avoid committing secrets
stripe.apiKey=${STRIPE_API_KEY}
stripe.webhookSecret=${STRIPE_WEBHOOK_SECRET}
stripe.successUrl=${STRIPE_SUCCESS_URL:http://localhost:3000/success}
stripe.cancelUrl=${STRIPE_CANCEL_URL:http://localhost:3000/cancel}
